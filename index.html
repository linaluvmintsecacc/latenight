<style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Nunito:wght@400;700&display=swap');

    body {
      margin: 0;
      padding: 40px 20px 80px;
      font-family: 'Nunito', sans-serif;
      /* Warna angkasa lepas (Deep Nebula) - Tidak terlalu hitam pekat */
      background: radial-gradient(circle at center, #1a2e1a 0%, #0d1a0d 100%);
      min-height: 100vh;
      color: #e0ffe0;
      overflow-x: hidden;
      position: relative;
    }

    /* Efek Bintang & Angkasa */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-image: 
        radial-gradient(1px 1px at 20px 30px, #fff, rgba(0,0,0,0)),
        radial-gradient(1px 1px at 40px 70px, #fff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 100px 150px, #8bc34a, rgba(0,0,0,0)),
        radial-gradient(1px 1px at 200px 250px, #fff, rgba(0,0,0,0));
      background-size: 200px 200px;
      animation: spaceMove 100s linear infinite;
      opacity: 0.4;
      z-index: 0;
    }

    @keyframes spaceMove {
      from { transform: translateY(0); }
      to { transform: translateY(-1000px); }
    }

    /* Floating Green Nebula */
    body::after {
      content: "";
      position: fixed;
      top: 50%; left: 50%;
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(76, 175, 80, 0.15) 0%, transparent 70%);
      transform: translate(-50%, -50%);
      z-index: 0;
      pointer-events: none;
    }

    #createBtn {
      position: fixed;
      top: 20px;
      left: 20px;
      background: rgba(46, 125, 50, 0.2);
      color: #8bc34a;
      border: 1px solid #8bc34a;
      padding: 10px 22px;
      border-radius: 4px;
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(139, 195, 74, 0.3);
      z-index: 1000;
      transition: all 0.3s ease;
      backdrop-filter: blur(5px);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    #createBtn:hover {
      background: #8bc34a;
      color: #0d1a0d;
      box-shadow: 0 0 25px rgba(139, 195, 74, 0.6);
    }

    h1 {
      text-align: center;
      margin-top: 50px;
      margin-bottom: 40px;
      font-family: 'Orbitron', sans-serif;
      font-weight: 800;
      font-size: 2.8rem;
      letter-spacing: 5px;
      color: #ffffff;
      text-shadow: 0 0 10px rgba(139, 195, 74, 0.8), 0 0 20px rgba(139, 195, 74, 0.4);
      z-index: 10;
      position: relative;
    }

    #updatesContainer {
      max-width: 950px;
      margin: 80px auto 0;
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      position: relative;
      z-index: 10;
    }

    .update-btn {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(139, 195, 74, 0.3);
      color: #ffffff;
      padding: 18px 30px;
      border-radius: 8px;
      font-family: 'Orbitron', sans-serif;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      flex: 1 1 220px;
      max-width: 300px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      position: relative;
    }

    .update-btn:hover {
      background: rgba(139, 195, 74, 0.2);
      border-color: #8bc34a;
      transform: translateY(-8px);
      box-shadow: 0 10px 25px rgba(139, 195, 74, 0.4);
    }

    /* Garisan dekoratif pada butang */
    .update-btn::after {
      content: "";
      position: absolute;
      bottom: 0; left: 0;
      width: 0%; height: 2px;
      background: #8bc34a;
      transition: width 0.3s ease;
    }

    .update-btn:hover::after {
      width: 100%;
    }

    /* Empty state */
    #updatesContainer p {
      width: 100%;
      text-align: center;
      font-style: italic;
      color: #8bc34a;
      font-family: 'Orbitron', sans-serif;
      font-size: 1.1rem;
      margin-top: 60px;
      letter-spacing: 2px;
    }

    /* Responsive */
    @media (max-width: 600px) {
      h1 { font-size: 1.8rem; }
      #updatesContainer { gap: 15px; }
      .update-btn { flex: 1 1 100%; max-width: 100%; }
    }
</style>

<body>
  <button id="createBtn">New_Mission_Log</button>
  <h1>Data_Terminus</h1>
  <div id="updatesContainer"></div>
