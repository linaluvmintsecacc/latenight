<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Update</title>
  <title>Updatea</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Nunito:wght@400;700&display=swap');

    body {
      margin: 0;
      padding: 40px 20px 80px;
      font-family: 'Nunito', sans-serif;
      /* Tema Angkasa Lepas (Deep Space Green) */
      background: radial-gradient(circle at center, #1b3d1b 0%, #0a140a 100%);
      min-height: 100vh;
      color: #b2ffb2;
      overflow-x: hidden;
      position: relative;
    }

    /* Efek Bintang Bergerak */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 200%; height: 200%;
      background-image: 
        radial-gradient(2px 2px at 20px 30px, #eee, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 150px 150px, #4caf50, rgba(0,0,0,0)),
        radial-gradient(1px 1px at 300px 400px, #fff, rgba(0,0,0,0));
      background-size: 300px 300px;
      animation: spaceShift 150s linear infinite;
      opacity: 0.3;
      z-index: 0;
    }

    @keyframes spaceShift {
      from { transform: translate(0, 0); }
      to { transform: translate(-50%, -50%); }
    }

    /* Floating Nebula Glow */
    .nebula {
      position: fixed;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(76, 175, 80, 0.1) 0%, transparent 70%);
      filter: blur(50px);
      z-index: 0;
      pointer-events: none;
      animation: floatNebula 20s ease-in-out infinite;
    }

    @keyframes floatNebula {
      0%, 100% { transform: translate(10%, 10%); }
      50% { transform: translate(50%, 20%); }
    }

    #createBtn {
      position: fixed;
      top: 20px;
      left: 20px;
      background: rgba(46, 125, 50, 0.3);
      color: #ffffff;
      border: 1px solid #4caf50;
      padding: 10px 18px;
      border-radius: 4px; /* Gaya Cyberpunk lebih petak */
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(76, 175, 80, 0.4);
      z-index: 1000;
      transition: all 0.3s ease;
      backdrop-filter: blur(5px);
      text-transform: uppercase;
    }

    #createBtn:hover {
      background: #4caf50;
      box-shadow: 0 0 25px rgba(76, 175, 80, 0.8);
      transform: scale(1.05);
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      font-family: 'Orbitron', sans-serif;
      font-weight: 800;
      font-size: 2.8rem;
      color: #ffffff;
      text-shadow: 0 0 10px rgba(76, 175, 80, 0.7), 0 0 30px rgba(76, 175, 80, 0.3);
      z-index: 10;
      position: relative;
      letter-spacing: 4px;
    }

    #updatesContainer {
      max-width: 900px;
      margin: 100px auto 0;
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      justify-content: center;
      position: relative;
      z-index: 10;
    }

    .update-btn {
      /* Kekal fungsi warna dari JS, tapi tambah efek Glassmorphism */
      background: rgba(255, 255, 255, 0.1) !important; 
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.2) !important;
      color: white;
      padding: 16px 26px;
      border-radius: 12px;
      font-family: 'Orbitron', sans-serif;
      font-weight: 600;
      font-size: 1.1rem;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      flex: 1 1 200px;
      max-width: 280px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }

    .update-btn:hover {
      transform: translateY(-5px);
      border-color: #ffffff !important;
      box-shadow: 0 8px 25px rgba(76, 175, 80, 0.5) !important;
    }

    #updatesContainer p {
      width: 100%;
      text-align: center;
      font-family: 'Orbitron', sans-serif;
      color: #8bc34a;
      font-size: 1.2rem;
      margin-top: 60px;
      letter-spacing: 1px;
    }

    @media (max-width: 600px) {
      h1 { font-size: 2rem; }
      .update-btn { flex: 1 1 100%; max-width: 100%; }
    }
  </style>
</head>
<body>
  <div class="nebula"></div>

  <button id="createBtn">Buat Update Baru</button>
  <h1>Updates</h1>
  <div id="updatesContainer"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs, orderBy, query } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD5kksl475n1Blo9tjP9KVMSrebO8AFJxc",
      authDomain: "latenight-4c61a.firebaseapp.com",
      projectId: "latenight-4c61a",
      storageBucket: "latenight-4c61a.appspot.com",
      messagingSenderId: "208698993180",
      appId: "1:208698993180:web:7741767d129b4d43034dd9",
      measurementId: "G-MVKZ0R87Y3"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    document.getElementById('createBtn').onclick = () => window.location.href = 'create.html';
    const updatesContainer = document.getElementById('updatesContainer');

    function shadeColor(color, percent) {
      let R = parseInt(color.substring(1, 3), 16),
          G = parseInt(color.substring(3, 5), 16),
          B = parseInt(color.substring(5, 7), 16);
      R = parseInt(R * (100 + percent) / 100);
      G = parseInt(G * (100 + percent) / 100);
      B = parseInt(B * (100 + percent) / 100);
      return "#" + [R, G, B].map(x => Math.min(255, x).toString(16).padStart(2, "0")).join("");
    }

    async function loadUpdates() {
      const q = query(collection(db, "updates"), orderBy("createdAt", "desc"));
      const snap = await getDocs(q);
      updatesContainer.innerHTML = '';
      if (snap.empty) {
        updatesContainer.innerHTML = `<p>Tiada update lagi, buat update baru!</p>`;
        return;
      }
      snap.forEach(doc => {
        const data = doc.data();
        const btn = document.createElement('button');
        btn.className = 'update-btn';
        btn.textContent = data.tajuk || '(Tiada tajuk)';
        const themeColor = data.themeColor || '#4caf50';
        btn.style.backgroundColor = themeColor;
        btn.style.boxShadow = `0 6px 14px ${shadeColor(themeColor, 10)}`;
        btn.onclick = () => window.location.href = `update.html?id=${doc.id}`;
        updatesContainer.appendChild(btn);
      });
    }

    loadUpdates();
  </script>
</body>
</html>
