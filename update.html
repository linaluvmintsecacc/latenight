<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Update Detail</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:Nunito,sans-serif;
  background:radial-gradient(circle,#1b3d1b,#0a140a);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#e0ffe0;
}
.container{
  max-width:650px;
  width:100%;
  background:rgba(255,255,255,.03);
  border:1px solid rgba(76,175,80,.3);
  border-radius:20px;
  padding:40px;
  backdrop-filter:blur(14px);
}
h1{
  font-family:Orbitron,sans-serif;
  text-align:center;
  border-bottom:2px solid rgba(76,175,80,.5);
  padding-bottom:15px;
}
.media-container{
  margin:25px 0;
  text-align:center;
}
.media-container img,
.media-container video{
  max-width:100%;
  max-height:420px;
  border-radius:14px;
  box-shadow:0 0 20px rgba(0,0,0,.6);
}
p{
  background:rgba(0,0,0,.25);
  padding:18px;
  border-left:4px solid #4caf50;
  border-radius:10px;
  white-space:pre-wrap;
}
button{
  margin-top:25px;
  display:block;
  margin-inline:auto;
  padding:12px 40px;
  font-family:Orbitron;
  background:rgba(76,175,80,.15);
  color:#8bc34a;
  border:1px solid #8bc34a;
  border-radius:8px;
  cursor:pointer;
}
button:hover{
  background:#4caf50;
  color:#fff;
}
</style>
</head>

<body>

<div class="container">
  <h1 id="updateTitle">Loading...</h1>
  <div class="media-container" id="mediaContainer"></div>
  <p id="updateContent"></p>
  <button onclick="location.href='index.html'">Kembali</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getStorage, ref, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyD5kksl475n1Blo9tjP9KVMSrebO8AFJxc",
  authDomain: "latenight-4c61a.firebaseapp.com",
  projectId: "latenight-4c61a",
  storageBucket: "latenight-4c61a.appspot.com",
  messagingSenderId: "208698993180",
  appId: "1:208698993180:web:7741767d129b4d43034dd9"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const storage = getStorage(app);

const id = new URLSearchParams(location.search).get("id");

const titleEl = document.getElementById("updateTitle");
const contentEl = document.getElementById("updateContent");
const mediaEl = document.getElementById("mediaContainer");

async function loadUpdate(){
  if(!id){
    alert("ID tiada");
    location.href="index.html";
    return;
  }

  const snap = await getDoc(doc(db,"updates",id));
  if(!snap.exists()){
    alert("Update tak jumpa");
    location.href="index.html";
    return;
  }

  const data = snap.data();
  titleEl.textContent = data.tajuk;
  contentEl.textContent = data.isi;

  if(!data.mediaUrl) return;

  let url = data.mediaUrl;

  // JIKA gs:// → convert ke https
  if(url.startsWith("gs://")){
    const storageRef = ref(storage, url);
    url = await getDownloadURL(storageRef);
  }

  // render
  const img = document.createElement("img");
  img.src = url;

  img.onload = ()=> mediaEl.appendChild(img);
  img.onerror = ()=>{
    const video = document.createElement("video");
    video.src = url;
    video.controls = true;
    mediaEl.appendChild(video);
  };
}

loadUpdate();
</script>

</body>
</html>
