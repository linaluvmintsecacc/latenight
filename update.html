<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Update Detail</title>

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Nunito:wght@400;700&display=swap" rel="stylesheet" />

  <style>
    body {
      margin: 0;
      font-family: 'Nunito', sans-serif;
      background: radial-gradient(circle at center, #1b3d1b 0%, #0a140a 100%);
      min-height: 100vh;
      color: #e0ffe0;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 20px;
      box-sizing: border-box;
      overflow-x: hidden;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: 
        radial-gradient(1px 1px at 10% 30%, #fff, transparent),
        radial-gradient(2px 2px at 80% 70%, #4caf50, transparent),
        radial-gradient(1px 1px at 40% 85%, #fff, transparent);
      background-size: 300px 300px;
      opacity: 0.2;
      z-index: 0;
    }

    .container {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(15px);
      border-radius: 20px;
      padding: 40px 50px;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.5), 0 0 20px rgba(76, 175, 80, 0.1);
      border: 1px solid rgba(76, 175, 80, 0.3);
      max-width: 650px;
      width: 100%;
      position: relative;
      z-index: 1;
    }

    h1 {
      font-family: 'Orbitron', sans-serif;
      border-bottom: 2px solid rgba(76, 175, 80, 0.5);
      padding-bottom: 15px;
      margin-bottom: 30px;
      text-align: center;
      color: #fff;
      letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(76, 175, 80, 0.5);
    }

    p {
      font-size: 1.1rem;
      line-height: 1.8;
      white-space: pre-wrap;
      margin-bottom: 30px;
      color: #c8e6c9;
      background: rgba(0, 0, 0, 0.2);
      padding: 20px;
      border-radius: 12px;
      border-left: 4px solid #4caf50;
    }

    .media-container {
      text-align: center;
      margin-bottom: 30px;
      background: rgba(0,0,0,0.3);
      padding: 12px;
      border-radius: 18px;
      border: 1px dashed rgba(76, 175, 80, 0.3);
    }

    .media-container img,
    .media-container video {
      max-width: 100%;
      max-height: 400px;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
    }

    #back-btn {
      background: rgba(76, 175, 80, 0.1);
      color: #8bc34a;
      border: 1px solid #8bc34a;
      padding: 12px 40px;
      border-radius: 8px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.9rem;
      cursor: pointer;
      display: block;
      margin: 0 auto;
      transition: 0.3s;
      letter-spacing: 2px;
    }

    #back-btn:hover {
      background: #4caf50;
      color: #fff;
      box-shadow: 0 0 20px rgba(76, 175, 80, 0.4);
      transform: translateY(-2px);
    }

    .menu-wrapper {
      position: absolute;
      top: 25px;
      right: 25px;
    }

    .menu-button {
      width: 35px;
      height: 35px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(76, 175, 80, 0.3);
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 3px;
    }

    .menu-button span {
      width: 4px;
      height: 4px;
      background: #8bc34a;
      border-radius: 50%;
      box-shadow: 0 0 5px rgba(76,175,80,.8);
    }

    .menu-content {
      display: none;
      position: absolute;
      top: 45px;
      right: 0;
      background: #1b3d1b;
      border: 1px solid #4caf50;
      border-radius: 8px;
      overflow: hidden;
      min-width: 140px;
      z-index: 99;
    }

    .menu-content.show {
      display: block;
      animation: fadeIn .2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .menu-content button {
      width: 100%;
      background: transparent;
      border: none;
      padding: 12px 20px;
      cursor: pointer;
      text-align: left;
      font-family: 'Orbitron', sans-serif;
      font-size: .8rem;
      color: #e0ffe0;
    }

    .menu-content button:hover {
      background: #4caf50;
      color: #fff;
    }

    #deleteBtn { color: #ff5252; }
    #deleteBtn:hover { background: #ff5252; }

    @media (max-width: 600px) {
      .container { padding: 30px 20px; }
      h1 { font-size: 1.6rem; }
      p { font-size: 1rem; }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="menu-wrapper">
      <button class="menu-button">
        <span></span><span></span><span></span>
      </button>
      <div class="menu-content" id="menuContent">
        <button id="editBtn">EDIT LOG</button>
        <button id="deleteBtn">DELETE LOG</button>
      </div>
    </div>

    <h1 id="updateTitle">Tajuk Update</h1>
    <div class="media-container" id="mediaContainer"></div>
    <p id="updateContent">Isi update akan dipaparkan di sini.</p>
    <button id="back-btn">Kembali ke Pangkalan</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, getDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD5kksl475n1Blo9tjP9KVMSrebO8AFJxc",
      authDomain: "latenight-4c61a.firebaseapp.com",
      projectId: "latenight-4c61a",
      storageBucket: "latenight-4c61a.appspot.com",
      messagingSenderId: "208698993180",
      appId: "1:208698993180:web:7741767d129b4d43034dd9"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const params = new URLSearchParams(window.location.search);
    const updateId = params.get("id");

    const updateTitle = document.getElementById("updateTitle");
    const updateContent = document.getElementById("updateContent");
    const mediaContainer = document.getElementById("mediaContainer");

    const backBtn = document.getElementById("back-btn");
    const menuButton = document.querySelector(".menu-button");
    const menuContent = document.getElementById("menuContent");
    const editBtn = document.getElementById("editBtn");
    const deleteBtn = document.getElementById("deleteBtn");

    async function loadUpdate() {
      if (!updateId) {
        alert("Update tidak dijumpai.");
        location.href = "index.html";
        return;
      }

      try {
        const snap = await getDoc(doc(db, "updates", updateId));

        if (!snap.exists()) {
          alert("Update tidak dijumpai.");
          location.href = "index.html";
          return;
        }

        const data = snap.data();
        updateTitle.textContent = data.tajuk;
        updateContent.textContent = data.isi;

        if (data.mediaUrl) {
          mediaContainer.innerHTML = "";

          const img = document.createElement("img");
          img.src = data.mediaUrl;

          img.onload = () => mediaContainer.appendChild(img);
          img.onerror = () => {
            const video = document.createElement("video");
            video.src = data.mediaUrl;
            video.controls = true;
            mediaContainer.appendChild(video);
          };
        } else {
          mediaContainer.style.display = "none";
        }

      } catch (e) {
        console.error(e);
        alert("Gagal memuatkan update.");
        location.href = "index.html";
      }
    }

    loadUpdate();

    backBtn.onclick = () => location.href = "index.html";
    menuButton.onclick = () => menuContent.classList.toggle("show");

    document.addEventListener("click", e => {
      if (!menuButton.contains(e.target) && !menuContent.contains(e.target)) {
        menuContent.classList.remove("show");
      }
    });

    editBtn.onclick = () => location.href = `create.html?id=${updateId}&edit=true`;

    deleteBtn.onclick = async () => {
      if (confirm("Padam update ini?")) {
        await deleteDoc(doc(db, "updates", updateId));
        alert("Update dipadam.");
        location.href = "index.html";
      }
    };
  </script>
</body>
</html>
