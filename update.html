<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Update Detail</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Nunito:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    body {
      margin: 0;
      font-family: 'Nunito', sans-serif;
      /* Tema Deep Space Green */
      background: radial-gradient(circle at center, #1b3d1b 0%, #0a140a 100%);
      min-height: 100vh;
      color: #e0ffe0;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 20px;
      box-sizing: border-box;
      overflow-x: hidden;
      position: relative;
    }

    /* Efek Bintang Bergerak */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-image: 
        radial-gradient(1px 1px at 10% 30%, #fff, transparent),
        radial-gradient(2px 2px at 80% 70%, #4caf50, transparent),
        radial-gradient(1px 1px at 40% 85%, #fff, transparent);
      background-size: 300px 300px;
      opacity: 0.2;
      z-index: 0;
    }

    .container {
      background: rgba(10, 25, 10, 0.85);
      backdrop-filter: blur(15px);
      border-radius: 20px;
      padding: 50px 40px;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.8), 0 0 20px rgba(76, 175, 80, 0.2);
      border: 1px solid rgba(76, 175, 80, 0.4);
      max-width: 750px;
      width: 100%;
      box-sizing: border-box;
      position: relative;
      z-index: 1;
    }

    h1 {
      font-family: 'Orbitron', sans-serif;
      border-bottom: 2px solid #4caf50;
      padding-bottom: 15px;
      margin-bottom: 35px;
      font-weight: 700;
      text-align: center;
      color: #ffffff;
      letter-spacing: 3px;
      text-shadow: 0 0 15px rgba(76, 175, 80, 0.8);
    }

    /* --- HIASAN TEXT PANJANG (DATA LOG) --- */
    #updateContent {
      font-size: 1.1rem;
      line-height: 1.8;
      white-space: pre-wrap;
      margin-bottom: 35px;
      color: #d1ffd1;
      background: rgba(0, 0, 0, 0.4);
      padding: 30px;
      border-radius: 12px;
      border: 1px solid rgba(76, 175, 80, 0.3);
      position: relative;
      box-shadow: inset 0 0 30px rgba(0, 255, 0, 0.05);
      font-family: 'Nunito', sans-serif;
    }

    /* Label Dekoratif pada Teks */
    #updateContent::before {
      content: "SYSTEM_DECRYPTED_LOG";
      position: absolute;
      top: -12px;
      left: 20px;
      background: #4caf50;
      color: #0a140a;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.65rem;
      padding: 3px 12px;
      font-weight: bold;
      border-radius: 4px;
      letter-spacing: 1px;
    }

    /* Garis bawah dekoratif dalam box teks */
    #updateContent::after {
      content: "";
      position: absolute;
      bottom: 10px;
      right: 15px;
      width: 40px;
      height: 4px;
      background: rgba(76, 175, 80, 0.5);
      border-radius: 2px;
    }

    .media-container {
      text-align: center;
      margin-bottom: 35px;
      background: rgba(0, 0, 0, 0.3);
      padding: 15px;
      border-radius: 15px;
      border: 1px dashed rgba(76, 175, 80, 0.2);
    }

    .media-container img,
    .media-container video {
      max-width: 100%;
      max-height: 450px;
      border-radius: 8px;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(76, 175, 80, 0.4);
    }

    #back-btn {
      background: transparent;
      color: #8bc34a;
      border: 1px solid #8bc34a;
      padding: 14px 45px;
      border-radius: 5px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      display: block;
      margin: 0 auto;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    #back-btn:hover {
      background-color: #4caf50;
      color: #0a140a;
      box-shadow: 0 0 20px rgba(76, 175, 80, 0.6);
      transform: translateY(-2px);
    }

    /* Menu Wrapper (Titik Tiga) */
    .menu-wrapper {
      position: absolute;
      top: 25px;
      right: 25px;
    }

    .menu-button {
      width: 35px;
      height: 35px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(76, 175, 80, 0.3);
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 3px;
      transition: 0.3s;
    }

    .menu-button:hover { background: rgba(76, 175, 80, 0.2); }

    .menu-button span {
      width: 4px;
      height: 4px;
      background-color: #8bc34a;
      border-radius: 50%;
    }

    .menu-content {
      display: none;
      position: absolute;
      top: 45px;
      right: 0;
      background: #112211;
      border: 1px solid #4caf50;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      z-index: 100;
      min-width: 150px;
      overflow: hidden;
    }

    .menu-content.show { display: block; animation: fadeIn 0.2s ease; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .menu-content button {
      width: 100%;
      background: transparent;
      border: none;
      padding: 12px 20px;
      text-align: left;
      cursor: pointer;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.75rem;
      color: #e0ffe0;
    }

    .menu-content button:hover {
      background-color: #4caf50;
      color: #000;
    }

    #deleteBtn { color: #ff5252; }
    #deleteBtn:hover { background-color: #ff5252; color: #fff; }

    @media (max-width: 600px) {
      .container { padding: 40px 20px; }
      h1 { font-size: 1.6rem; }
      #updateContent { font-size: 1rem; padding: 20px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="menu-wrapper">
      <button class="menu-button" aria-label="Options">
        <span></span><span></span><span></span>
      </button>
      <div class="menu-content" id="menuContent">
        <button id="editBtn">ACCESS_EDIT</button>
        <button id="deleteBtn">TERMINATE_LOG</button>
      </div>
    </div>
    
    <h1 id="updateTitle">Tajuk Update</h1>
    <div class="media-container" id="mediaContainer"></div>
    <p id="updateContent">Isi update akan dipaparkan di sini.</p>
    <button id="back-btn">Kembali ke Pangkalan</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, getDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // Firebase Config asal dikekalkan
    const firebaseConfig = {
      apiKey: "AIzaSyD5kksl475n1Blo9tjP9KVMSrebO8AFJxc",
      authDomain: "latenight-4c61a.firebaseapp.com",
      projectId: "latenight-4c61a",
      storageBucket: "latenight-4c61a.appspot.com",
      messagingSenderId: "208698993180",
      appId: "1:208698993180:web:7741767d129b4d43034dd9",
      measurementId: "G-MVKZ0R87Y3"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const params = new URLSearchParams(window.location.search);
    const updateId = params.get("id");

    const updateTitle = document.getElementById("updateTitle");
    const updateContent = document.getElementById("updateContent");
    const mediaContainer = document.getElementById("mediaContainer");
    const backBtn = document.getElementById("back-btn");
    const menuButton = document.querySelector(".menu-button");
    const menuContent = document.getElementById("menuContent");
    const editBtn = document.getElementById("editBtn");
    const deleteBtn = document.getElementById("deleteBtn");

    async function loadUpdate() {
      if (!updateId) {
        alert("Update tidak dijumpai.");
        window.location.href = "index.html";
        return;
      }
      try {
        const docRef = doc(db, "updates", updateId);
        const docSnap = await getDoc(docRef);

        if (docSnap.exists()) {
          const data = docSnap.data();
          updateTitle.textContent = data.tajuk;
          updateContent.textContent = data.isi;

          if (data.mediaUrl) {
            const url = data.mediaUrl;
            if (url.match(/\.(jpg|jpeg|png|gif|webp)$/i)) {
              mediaContainer.innerHTML = `<img src="${url}" alt="Media" />`;
            } else if (url.match(/\.(mp4|webm|ogg)$/i)) {
              mediaContainer.innerHTML = `<video src="${url}" controls></video>`;
            }
          }
        } else {
          alert("Update tidak dijumpai.");
          window.location.href = "index.html";
        }
      } catch (error) {
        console.error("Gagal dapat data update:", error);
        alert("Gagal memuatkan update.");
        window.location.href = "index.html";
      }
    }

    loadUpdate();

    backBtn.onclick = () => window.location.href = "index.html";
    menuButton.onclick = () => menuContent.classList.toggle("show");

    document.addEventListener("click", (e) => {
      if (!menuButton.contains(e.target) && !menuContent.contains(e.target)) {
        menuContent.classList.remove("show");
      }
    });

    editBtn.onclick = () => {
      window.location.href = `create.html?id=${updateId}&edit=true`;
    };

    deleteBtn.onclick = async () => {
      if (confirm("Adakah anda pasti mahu memadam update ini?")) {
        try {
          await deleteDoc(doc(db, "updates", updateId));
          alert("Update berjaya dipadam.");
          window.location.href = "index.html";
        } catch (error) {
          console.error("Gagal memadam update:", error);
          alert("Gagal memadam update.");
        }
      }
    };
  </script>
</body>
</html>
