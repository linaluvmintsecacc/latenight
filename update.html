<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Update Detail</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Nunito:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    body {
      margin: 0;
      font-family: 'Nunito', sans-serif;
      /* Warna Deep Space Green - Bukan hitam pekat */
      background: radial-gradient(circle at center, #1b3d1b 0%, #0a140a 100%);
      min-height: 100vh;
      color: #e0ffe0;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 20px;
      box-sizing: border-box;
      overflow-x: hidden;
      position: relative;
    }

    /* Decoration: Bintang Angkasa */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-image: 
        radial-gradient(1px 1px at 20px 30px, #fff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 100px 150px, #4caf50, rgba(0,0,0,0)),
        radial-gradient(1px 1px at 200px 400px, #fff, rgba(0,0,0,0));
      background-size: 300px 300px;
      opacity: 0.3;
      z-index: 0;
    }

    .container {
      /* Efek Glassmorphism Cyberpunk */
      background: rgba(20, 40, 20, 0.8);
      backdrop-filter: blur(15px);
      border-radius: 20px;
      padding: 40px 40px;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.6), 0 0 20px rgba(76, 175, 80, 0.2);
      border: 1px solid rgba(76, 175, 80, 0.4);
      max-width: 650px;
      width: 100%;
      box-sizing: border-box;
      position: relative;
      z-index: 1;
    }

    h1 {
      font-family: 'Orbitron', sans-serif;
      border-bottom: 2px solid #4caf50;
      padding-bottom: 15px;
      margin-bottom: 30px;
      font-weight: 700;
      text-align: center;
      letter-spacing: 2px;
      color: #ffffff;
      text-shadow: 0 0 10px rgba(76, 175, 80, 0.8);
    }

    /* Decoration: Box untuk isi kandungan */
    p {
      font-size: 1.1rem;
      line-height: 1.8;
      white-space: pre-wrap;
      margin-bottom: 30px;
      background: rgba(0, 0, 0, 0.3);
      padding: 20px;
      border-radius: 10px;
      border-left: 4px solid #4caf50;
      color: #d1ffd1;
    }

    .media-container {
      text-align: center;
      margin-bottom: 30px;
      background: rgba(0, 0, 0, 0.2);
      padding: 10px;
      border-radius: 15px;
    }

    .media-container img,
    .media-container video {
      max-width: 100%;
      max-height: 350px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(76, 175, 80, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Button Style: Cyberpunk Green */
    #back-btn {
      background: transparent;
      color: #4caf50;
      border: 1px solid #4caf50;
      padding: 12px 35px;
      border-radius: 5px;
      font-family: 'Orbitron', sans-serif;
      font-weight: 600;
      cursor: pointer;
      display: block;
      margin: 0 auto;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    #back-btn:hover {
      background-color: #4caf50;
      color: #0a140a;
      box-shadow: 0 0 20px rgba(76, 175, 80, 0.6);
    }

    /* Menu Decoration */
    .menu-wrapper {
      position: absolute;
      top: 25px;
      right: 25px;
    }

    .menu-button {
      width: 32px;
      height: 32px;
      background: rgba(76, 175, 80, 0.1);
      border: 1px solid #4caf50;
      border-radius: 5px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      align-items: center;
      padding: 5px;
    }

    .menu-button span {
      width: 5px;
      height: 5px;
      background-color: #4caf50;
      border-radius: 50%;
      box-shadow: 0 0 5px #4caf50;
    }

    .menu-content {
      display: none;
      position: absolute;
      top: 40px;
      right: 0;
      background: #152515;
      border: 1px solid #4caf50;
      border-radius: 8px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
      z-index: 100;
      min-width: 120px;
      overflow: hidden;
    }

    .menu-content.show { display: block; }

    .menu-content button {
      width: 100%;
      background: transparent;
      border: none;
      padding: 12px 15px;
      text-align: left;
      cursor: pointer;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.8rem;
      color: #e0ffe0;
      transition: 0.2s;
    }

    .menu-content button:hover {
      background-color: #4caf50;
      color: #0a140a;
    }

    @media (max-width: 600px) {
      .container { padding: 30px 20px; }
      h1 { font-size: 1.5rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="menu-wrapper">
      <button class="menu-button" aria-label="Options">
        <span></span><span></span><span></span>
      </button>
      <div class="menu-content" id="menuContent">
        <button id="editBtn">EDIT_LOG</button>
        <button id="deleteBtn">DELETE_LOG</button>
      </div>
    </div>
    <h1 id="updateTitle">Tajuk Update</h1>
    <div class="media-container" id="mediaContainer"></div>
    <p id="updateContent">Isi update akan dipaparkan di sini.</p>
    <button id="back-btn">Kembali ke Pangkalan</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, getDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD5kksl475n1Blo9tjP9KVMSrebO8AFJxc",
      authDomain: "latenight-4c61a.firebaseapp.com",
      projectId: "latenight-4c61a",
      storageBucket: "latenight-4c61a.appspot.com",
      messagingSenderId: "208698993180",
      appId: "1:208698993180:web:7741767d129b4d43034dd9",
      measurementId: "G-MVKZ0R87Y3"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const params = new URLSearchParams(window.location.search);
    const updateId = params.get("id");

    const updateTitle = document.getElementById("updateTitle");
    const updateContent = document.getElementById("updateContent");
    const mediaContainer = document.getElementById("mediaContainer");
    const backBtn = document.getElementById("back-btn");
    const menuButton = document.querySelector(".menu-button");
    const menuContent = document.getElementById("menuContent");
    const editBtn = document.getElementById("editBtn");
    const deleteBtn = document.getElementById("deleteBtn");

    async function loadUpdate() {
      if (!updateId) {
        alert("Update tidak dijumpai.");
        window.location.href = "index.html";
        return;
      }
      try {
        const docRef = doc(db, "updates", updateId);
        const docSnap = await getDoc(docRef);

        if (docSnap.exists()) {
          const data = docSnap.data();
          updateTitle.textContent = data.tajuk;
          updateContent.textContent = data.isi;

          // Paparkan media kalau ada
          if (data.mediaUrl) {
            const url = data.mediaUrl;
            if (url.match(/\.(jpg|jpeg|png|gif|webp)$/i)) {
              mediaContainer.innerHTML = `<img src="${url}" alt="Media" />`;
            } else if (url.match(/\.(mp4|webm|ogg)$/i)) {
              mediaContainer.innerHTML = `<video src="${url}" controls></video>`;
            }
          }
        } else {
          alert("Update tidak dijumpai.");
          window.location.href = "index.html";
        }
      } catch (error) {
        console.error("Gagal dapat data update:", error);
        alert("Gagal memuatkan update. Sila cuba lagi.");
        window.location.href = "index.html";
      }
    }

    loadUpdate();

    backBtn.onclick = () => window.location.href = "index.html";

    menuButton.onclick = () => menuContent.classList.toggle("show");

    document.addEventListener("click", (e) => {
      if (!menuButton.contains(e.target) && !menuContent.contains(e.target)) {
        menuContent.classList.remove("show");
      }
    });

    editBtn.onclick = () => {
      window.location.href = `create.html?id=${updateId}&edit=true`;
    };

    deleteBtn.onclick = async () => {
      if (confirm("Adakah anda pasti mahu memadam update ini?")) {
        try {
          await deleteDoc(doc(db, "updates", updateId));
          alert("Update berjaya dipadam.");
          window.location.href = "index.html";
        } catch (error) {
          console.error("Gagal memadam update:", error);
          alert("Gagal memadam update. Sila cuba lagi.");
        }
      }
    };
  </script>
</body>
</html>
